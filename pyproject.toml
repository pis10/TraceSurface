[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracesurface"
version = "1.0.0"
description = "API discovery through dynamic tracing and static AST analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["api", "ast", "cdp", "playwright", "security"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.58.0",
    "tree-sitter>=0.25.1",
    "tree-sitter-javascript>=0.25.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
tracesurface = "tracesurface.cli:app"

[project.urls]
Repository = "https://github.com/pis10/TraceSurface"
Issues = "https://github.com/pis10/TraceSurface/issues"

[tool.hatch.build.targets.sdist.force-include]
"tracesurface/server/static" = "tracesurface/server/static"

[tool.hatch.build.targets.wheel]
# 前端产物被 .gitignore 排除，用 artifacts 显式纳入 wheel；目录不存在时静默跳过，
# 保证全新克隆（未构建前端）也能 uv sync
artifacts = ["tracesurface/server/static/**"]

[dependency-groups]
dev = [
    "basedpyright>=1.29.0",
]

[tool.basedpyright]
include = ["tracesurface"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeArgument = "warning"
reportImportCycles = "warning"
reportImplicitStringConcatenation = "none"
reportCallInDefaultInitializer = "none"
reportUnusedCallResult = "none"
reportAny = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportExplicitAny = "none"
reportImplicitOverride = "none"
