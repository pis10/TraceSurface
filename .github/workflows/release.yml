name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: tracesurface-windows-x86_64.zip
          - runner: macos-15
            asset: tracesurface-macos-arm64.tar.gz
          - runner: ubuntu-22.04
            asset: tracesurface-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Test backend
        shell: bash
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            uv run python -m unittest discover -s tests -v
          else
            echo "No tests to run"
          fi

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build binary
        run: uv run --with nuitka==4.1.3 --with ordered-set --with zstandard python scripts/build-binary.py

      - name: Upload compilation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-report-${{ matrix.runner }}
          path: |
            build/nuitka/compilation-report.xml
            nuitka-crash-report.xml
          if-no-files-found: ignore

      - name: Smoke test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            uv run python scripts/smoke-binary.py build/nuitka/tracesurface.exe
          else
            uv run python scripts/smoke-binary.py build/nuitka/tracesurface
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive build/nuitka/tracesurface.exe "dist/${{ matrix.asset }}"

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C build/nuitka -czf "dist/${{ matrix.asset }}" tracesurface

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          test -s "$notes_file"
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_file"
