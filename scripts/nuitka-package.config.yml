# Nuitka 4.1.3 and 4.3 fail to compile this nested OR-pattern in LiteLLM
# 1.105.1. Splitting the alternatives preserves Python match semantics.
# This changes only the compiled source, never the installed dependency.
- module-name: 'litellm.litellm_core_utils.streaming_chunk_builder_utils'
  anti-bloat:
    - description: 'split nested OR-pattern for Nuitka compilation'
      replacements_plain:
        'case StreamingChoices(delta=Delta(role=str() as role)) | {"delta": {"role": str() as role}} if role:': "case StreamingChoices(delta=Delta(role=str() as role)) if role:\n                return role\n            case {\"delta\": {\"role\": str() as role}} if role:"
